[project]
name = "epistemics-mcp"
version = "0.1.0"
description = "MCP server that verifies capability/version/freshness claims before shipping them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yorick Lane"}]
keywords = ["mcp", "verification", "ai-agents", "epistemics", "claude"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
judge = ["openai>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
epistemics-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epistemics"]
